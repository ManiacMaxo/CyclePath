services:
  neo4j:
    image: neo4j:2026.01
    restart: unless-stopped
    ports:
      - 127.0.0.1:7474:7474
      - 127.0.0.1:7687:7687
    environment:
      - NEO4J_AUTH=none
      - NEO4J_PLUGINS=["graph-data-science", "apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - 127.0.0.1:5432:5432
    environment:
      POSTGRES_DB: cyclepath
      POSTGRES_USER: cyclepath
      POSTGRES_PASSWORD: super_strong_password
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
  neo4j_data:
  neo4j_import:
  neo4j_plugins:
